apiVersion: "cilium.io/v2"
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool-lan
spec:
  blocks:
    - start: "192.168.0.241"
      stop: "192.168.0.251"
  serviceSelector:
    matchLabels:
      app: nginx
---
apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: politica-l2
spec:
  interfaces:
    - "^eth[0-9]+$"
  externalIPs: true
  loadBalancerIPs: true